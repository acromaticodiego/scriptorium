# Local stack. One service today, because the in-process queue is honest about
# what it is: good for a single machine, and the seam (`jobs.base.JobQueue`) is
# where a Redis broker and separate worker replicas slot in. See README, Scaling.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SCR_OCR_ENGINE: tesseract
      SCR_OCR_LANG: spa+eng
      SCR_LIBRARY_DIR: /app/data/books
    volumes:
      # The library, on the host. A book is meant to outlive the process that
      # captured it, and a container is the shortest-lived process there is:
      # without this mount the books would sit inside the container's writable
      # layer and vanish on the next `up --build`, which would defeat the whole
      # point of storing them.
      - ./data:/app/data
      # Captures written by the CLI inside the container stay visible on the host.
      - ./out:/app/out
    restart: unless-stopped
